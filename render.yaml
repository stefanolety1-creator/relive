services:
  - type: web
    name: relive-windows-live
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DOMAIN_SUFFIX
        value: "@live.it"
      - key: COOKIE_NAME
        value: WL_AUTH_TOKEN
